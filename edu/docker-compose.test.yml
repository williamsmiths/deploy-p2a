services:
  # P2A Core System Application
  p2a-education-system:
    image: p2a-education-system:test
    #image: ghcr.io/williamsmiths/p2a-education:v1.0.8
    container_name: p2a-education-system
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=localhost
      - REDIS_PORT=6479
      - REDIS_PASSWORD=redis
    ports:
      - "6002:3002"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    networks:
      - p2a-asean-network

volumes:
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  p2a-asean-network:
    name: p2a-asean-network
    external: true
