services:
  # PostgreSQL Master Database for Business Module
  master:
    image: postgres:16
    container_name: postgres-business-master
    restart: always
    environment:
      POSTGRES_DB: ${DB_MASTER_DATABASE:-p2a_business}
      POSTGRES_USER: ${DB_MASTER_USERNAME:-p2a_user}
      POSTGRES_PASSWORD: ${DB_MASTER_PASSWORD:-Kx9mP2A2024MasterDB7nQ8vR3s}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
      # Replication settings
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: Kx9mP2A2024Replicator7nQ8vR3s
    ports:
      - "5536:5432"
    volumes:
      - pg_master_business_data:/var/lib/postgresql/data
      - ./postgres-business/master/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-business/master/conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres-business/master/conf/init-replication.sql:/docker-entrypoint-initdb.d/02-init-replication.sql:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - p2a-asean-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_MASTER_USERNAME:-p2a_user} -d ${DB_MASTER_DATABASE:-p2a_business}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL Slave (Read Replica - Streaming Replication)
  slave:
    image: postgres:16
    container_name: postgres-business-slave
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${DB_MASTER_USERNAME:-p2a_user}
      POSTGRES_PASSWORD: ${DB_MASTER_PASSWORD:-Kx9mP2A2024MasterDB7nQ8vR3s}
      POSTGRES_DB: ${DB_MASTER_DATABASE:-p2a_business}
    ports:
      - "5537:5432"
    volumes:
      - pg_slave_business_data:/var/lib/postgresql/data
      - ./postgres-business/slave/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-business/slave/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    depends_on:
      - master
    networks:
      - p2a-asean-network
    command: ["sh", "/usr/local/bin/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h postgres-business-master -p 5432 -U ${DB_MASTER_USERNAME:-p2a_user} || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  pg_master_business_data:
  pg_slave_business_data:
  redis_business_data:
    driver: local

networks:
  p2a-asean-network:
    name: p2a-asean-network
    external: true
