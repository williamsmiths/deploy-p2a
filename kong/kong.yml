_format_version: "3.0"
_transform: true

# Kong Gateway Configuration for P2A ASEAN Platform
# Load balancing và routing cho các module

services:
  # Core System Service - Module chính quản lý user, auth
  - name: p2a-core-system
    url: http://host.docker.internal:3000
    routes:
      - name: core-system-routes
        paths:
          - /api/core
          - /api/auth
          - /api/users
          - /api/admin
          - /api/master-data
          - /api/health
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          hour: 10000
          policy: local

  # Career Module Service
  - name: p2a-career
    url: http://10.220.19.17:3001
    routes:
      - name: career-routes
        paths:
          - /api/career
          - /api/career/health
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          hour: 10000
          policy: local

  # Education Module Service
  - name: p2a-education
    url: http://host.docker.internal:3002
    routes:
      - name: education-routes
        paths:
          - /api/education
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          hour: 10000
          policy: local

  # Research Module Service
  - name: p2a-research
    url: http://10.220.19.210:3003
    routes:
      - name: research-routes
        paths:
          - /api/research
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          hour: 10000
          policy: local

  # Business Module Service
  - name: p2a-business
    url: http://10.220.19.17:3004
    routes:
      - name: business-routes
        paths:
          - /api/business
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 10000
          policy: local

# Global CORS Plugin - Áp dụng cho tất cả services
plugins:
  - name: cors
    config:
      origins:
        # Danh sách các origin được phép truy cập
        - "http://10.220.19.82:8386"
        - "http://10.220.19.125:8386"
        - "http://10.220.19.210:8386"
        - "http://10.220.19.73:8386"
        - "http://localhost:8386"
        # Các origin khác nếu cần
        - "http://10.220.19.17:9000"
        - "http://10.220.19.17:3001"
        - "http://10.220.19.17:50051"
        - "http://10.220.19.17:3000"
        - "http://10.220.19.210:3001"
        - "http://localhost:3001"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - Authorization
        - Origin
      exposed_headers:
        - X-Auth-Token
        - Set-Cookie
      credentials: true
      max_age: 3600
      preflight_continue: false
