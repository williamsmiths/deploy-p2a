_format_version: "3.0"
_transform: true

# Kong Gateway Configuration for P2A ASEAN Platform
# Load balancing và routing cho các module

services:
  # Core System Service - Module chính quản lý user, auth
  - name: p2a-core-system
    url: http://host.docker.internal:3000
    routes:
      - name: core-system-routes
        paths:
          - /api/core
          - /api/auth
          - /api/users
          - /api/admin
          - /api/master-data
          - /api/health
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - X-Auth-Token
            - Authorization
          exposed_headers:
            - X-Auth-Token
          credentials: false
          max_age: 3600
          preflight_continue: false
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          policy: local

